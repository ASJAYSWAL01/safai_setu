plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    // Firebase (FCM push notifications) — reads android/app/google-services.json
    id "com.google.gms.google-services"
}

// Google Maps API key is read from android/google_maps.properties so the real
// key never lives in source control. Flutter regenerates local.properties on
// every build (wiping manual edits), so we use a dedicated file instead.
// Add: GOOGLE_MAPS_ANDROID_API_KEY=<your key> in android/google_maps.properties
def googleMapsProperties = new Properties()
def googleMapsPropertiesFile = rootProject.file('google_maps.properties')
if (googleMapsPropertiesFile.exists()) {
    googleMapsPropertiesFile.withInputStream { googleMapsProperties.load(it) }
}
def googleMapsApiKey = googleMapsProperties.getProperty('GOOGLE_MAPS_ANDROID_API_KEY', '')

android {
    namespace = "com.safaisetu.safai_setu"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        // flutter_local_notifications requires core library desugaring.
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.safaisetu.safai_setu"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        manifestPlaceholders['GOOGLE_MAPS_ANDROID_API_KEY'] = googleMapsApiKey
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Required by flutter_local_notifications (core library desugaring).
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
